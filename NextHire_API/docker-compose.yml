# utilize docker-compose up -d para rodar o container
# caso existir o container anterior rodando de:
# docker stop nexthire_database 
# docker rm -f nexthire_database
# e se necessário docker compose down --remove-orphans



services:
  nexthire-db:
    image: eukauecmp/nexthire-db:latest
    container_name: nexthire_api
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5432:5432"  # Porta exposta para a API usar
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: nexthire_redis
    restart: always
    ports:
      - "6379:6379"
