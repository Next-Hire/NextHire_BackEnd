name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore NextHire_API/NextHire_API.csproj
      - name: Build
        run: dotnet build NextHire_API/NextHire_API.csproj --no-restore -c Release
      - name: Smoke (sintaxe dos scripts)
        run: bash -n tests/contract.sh && bash -n tests/integration.sh
