version: '3.8'

services:
  nexthire-db:
    image: eukauecmp/nexthire-db:latest
    container_name: nexthire_api
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5432:5432"  # Porta exposta para a API usar
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: nexthire_redis
    restart: always
    ports:
      - "6379:6379"